spring.application.name=sorrisus
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

zapi.instance=${ZAPI_INSTANCE:}
zapi.token=${ZAPI_TOKEN:}
zapi.client-token=${ZAPI_CLIENT_TOKEN:}

sorrisus.lembretes-retorno.enabled=${RETORNO_LEMBRETE_ENABLED:false}
sorrisus.lembretes-retorno.cron=${RETORNO_LEMBRETE_CRON:0 0 9 * * *}
sorrisus.lembretes-retorno.zone=${RETORNO_LEMBRETE_ZONE:America/Fortaleza}
